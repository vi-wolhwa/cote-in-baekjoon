version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ['type:chore']
    commit-message:
      prefix: chore(deps)
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'eslint-config-prettier',
            'globals',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['type:ci']
    commit-message:
      prefix: ci
