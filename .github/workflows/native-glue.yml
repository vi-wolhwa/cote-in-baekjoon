# Compiles and runs solution-mode glue for languages the browser cannot run (tests/native).
# Toolchains follow Baekjoon's languages; see tests/native/*.test.ts for the exact commands.
name: 네이티브 연결 코드

on:
  pull_request:
    paths:
      - 'src/solution/**'
      - 'tests/native/**'
      - '.github/workflows/native-glue.yml'
  push:
    branches: [main]
    paths:
      - 'src/solution/**'
      - 'tests/native/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: 언어별 컴파일·실행
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 도구 버전
        run: |
          gcc --version | head -1
          go version
          rustc --version || true
          kotlinc -version 2>&1 || true
          swift --version || true
          dotnet --version
          ruby --version
      - name: 연결 코드 실행
        run: npx vitest run tests/native --passWithNoTests
        env:
          NATIVE_GLUE: '1'
