name: 입출력 형식 오류 신고
description: solution 함수로 풀 때 문제의 입출력 형식이 틀렸으면 알려 주세요. 확인한 뒤 다음 버전에서 고칩니다.
title: "[형식] "
labels: ["type:fix", "area:runner", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        확장의 '형식 오류 신고'로 열었다면 문제 번호와 형식이 이미 채워져 있습니다. **문제 본문이나 코드는 붙이지 마세요.** 이 이슈는 공개됩니다.
  - type: input
    id: problem
    attributes:
      label: 백준 문제 번호
      placeholder: "1000"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 틀렸나요? (선택)
      description: 한 줄이면 됩니다. 비워 두어도 확인합니다.
      placeholder: 예) 배열 길이가 n이 아니라 n-1이에요. / 반환값을 줄마다 출력해야 해요.
  - type: textarea
    id: io_format
    attributes:
      label: 확장이 쓴 입출력 형식
      render: json
  - type: input
    id: source
    attributes:
      label: 형식 출처
  - type: input
    id: version
    attributes:
      label: 확장 버전과 브라우저
      placeholder: "0.6.0 / Chrome 131"
