version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ['type:chore']
    commit-message:
      prefix: chore(deps)
    # Only take releases that are at least two weeks old.
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint supports TypeScript < 6.1. Lift this once it supports 7.x.
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'eslint-config-prettier',
            'globals',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['type:ci']
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
