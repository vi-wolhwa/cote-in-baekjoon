<!doctype html>
<!-- Synthetic page that mirrors the structure of a Baekjoon problem page.
     The text is written for this project; it is not copied from Baekjoon. -->
<html lang="ko">
  <head>
    <title>1000번: 테스트용 덧셈</title>
    <!-- A few Bootstrap 3 pill rules, written for this fixture, so the menu has its real size. -->
    <style>
      body {
        font-family: sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      .nav {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .nav::after {
        content: '';
        display: table;
        clear: both;
      }
      .nav-pills > li {
        float: left;
      }
      .nav-pills > li + li {
        margin-left: 2px;
      }
      .nav > li > a {
        position: relative;
        display: block;
        padding: 10px 15px;
        font-size: 13px;
        color: #555;
        text-decoration: none;
      }
      .nav-pills > li > a {
        border-radius: 0;
      }
      .nav > li > a:hover,
      .nav > li > a:focus {
        background-color: #eee;
      }
      .nav-pills > li.active > a {
        color: #fff;
        background-color: #428bca;
      }
    </style>
  </head>
  <body>
    <ul class="loginbar">
      <li><a href="/user/tester" class="username">tester</a></li>
    </ul>
    <ul class="nav nav-pills no-print problem-menu">
      <li class="active"><a href="/problem/1000">1000번</a></li>
      <li><a href="/submit/1000">제출</a></li>
      <li><a href="/problem/status/1000">맞힌 사람</a></li>
      <li><a href="/status?problem_id=1000">채점 현황</a></li>
      <li><a href="/board/search/all/problem/1000">질문 게시판</a></li>
    </ul>
    <div class="page-header">
      <h1>
        <span id="problem_title">테스트용 덧셈</span>
        <span class="problem-label problem-label-spj">스페셜 저지</span>
      </h1>
    </div>
    <table id="problem-info">
      <thead>
        <tr>
          <th>시간 제한</th>
          <th>메모리 제한</th>
          <th>제출</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>0.5 초 (추가 시간 없음)</td>
          <td>256 MB</td>
          <td>10</td>
        </tr>
      </tbody>
    </table>
    <section id="description">
      <div id="problem_description">
        <p>정수 \(A\)와 \(B\)를 더한다.</p>
        <p><img src="/upload/images/sample.png" alt="그림" /></p>
      </div>
    </section>
    <section id="input">
      <div id="problem_input"><p>첫 줄에 두 정수가 주어진다.</p></div>
    </section>
    <section id="output">
      <div id="problem_output"><p>합을 출력한다.</p></div>
    </section>
    <section id="limit" style="display: none"><div id="problem_limit"></div></section>
    <section id="hint">
      <div id="problem_hint">
        <p>링크는 <a href="/board/list">게시판</a>을 본다.</p>
      </div>
    </section>
    <pre class="sampledata" id="sample-input-1">1 2
</pre>
    <pre class="sampledata" id="sample-output-1">3
</pre>
    <pre class="sampledata" id="sample-input-2">10 20
</pre>
    <pre class="sampledata" id="sample-output-2">30
</pre>
  </body>
</html>
