name: 버그 신고
description: 기대와 다르게 동작하는 문제를 알려 주세요.
title: "[버그] "
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 잘못되었나요?
      description: 실제로 일어난 일을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 백준 1000번 문제 페이지에서 '코테 화면으로 풀기'를 누른다
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: input
    id: problem
    attributes:
      label: 백준 문제 번호
      placeholder: "1000"
  - type: dropdown
    id: browser
    attributes:
      label: 브라우저
      options: [Chrome, Microsoft Edge, 네이버 웨일, 기타]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 확장 버전
      description: chrome://extensions 에서 확인할 수 있습니다.
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷이나 추가 정보
