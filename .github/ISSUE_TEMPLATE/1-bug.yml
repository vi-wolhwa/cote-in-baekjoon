name: 문제 신고
description: 잘 안 되는 것이 있으면 알려 주세요. 1분이면 됩니다.
title: "[신고] "
labels: ["type:fix", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 고맙습니다. **별표(*) 항목만 채워도 충분합니다.** 확장 프로그램의 '문제 신고'로 열었다면 버전과 브라우저는 이미 채워져 있습니다.
  - type: dropdown
    id: area
    attributes:
      label: 어디에서 생겼나요?
      options:
        - 풀이 화면이 안 열림 / 버튼이 안 보임
        - 문제 내용이 이상하게 보임
        - 코드 실행
        - 제출 / 자동 제출
        - 채점 결과 표시
        - 코드가 사라짐
        - 팝업
        - 기타
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 잘못되었나요?
      description: 한두 줄이면 됩니다. 화면에 나온 메시지가 있으면 그대로 붙여 주세요.
      placeholder: 예) 제출하기를 눌렀는데 제출 창이 열리고 아무 일도 일어나지 않아요.
    validations:
      required: true
  - type: input
    id: problem
    attributes:
      label: 백준 문제 번호
      placeholder: "1000"
  - type: input
    id: language
    attributes:
      label: 언어
      placeholder: Python 3
  - type: input
    id: version
    attributes:
      label: 확장 버전과 브라우저
      placeholder: "0.3.0 / Chrome 131"
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷이나 더 알려 주실 것 (선택)
      description: 이미지를 끌어다 놓을 수 있습니다. 코드는 꼭 필요할 때만 붙여 주세요.
